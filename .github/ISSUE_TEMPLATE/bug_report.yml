---
name: Bug report
description: A command that failed, or a rebuild that did not come out as planned
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >-
        The command you ran, what it did, and what you expected. Never paste a recovery key, key ID or serial.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output or rebuild.log
      description: Remove anything private.
      render: text
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Machine model, firmware version and dbx-rollback version
      placeholder: Vendor and model, BIOS version, dbx-rollback 1.0.0
    validations:
      required: true
